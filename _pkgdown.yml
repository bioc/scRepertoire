reference:
- title: Loading and Processing Contigs
  desc: Functions that load, combine, and process the single-cell contig information.
- contents:
  - loadContigs
  - combineTCR
  - combineBCR
  - addVariable
  - subsetClones
  - exportClones
  - createHTOContigList
  - getContigDoublets
  - annotateInvariant
- title: Visualizing Clones
  desc: Functions for visualizing clonal data across samples and groups.
- contents:
  - clonalAbundance
  - clonalCompare
  - clonalDiversity
  - clonalHomeostasis
  - clonalLength
  - clonalOverlap
  - clonalProportion
  - clonalQuant
  - clonalRarefaction
  - clonalScatter
  - clonalSizeDistribution
  - clonalCluster
  - vizGenes
- title: Summarizing Repertoire
  desc: Functions to summarize clonal sequences across the repertoire.
- contents:
  - percentAA
  - positionalEntropy
  - positionalProperty
  - percentGenes
  - percentKmer
  - percentVJ
- title: Single-Cell Object Processing and Visualizations
  desc: Functions to add or visualize clonal information along a single-cell object.
- contents:
  - combineExpression
  - alluvialClones
  - clonalBias
  - clonalNetwork
  - clonalOccupy
  - clonalOverlay
  - getCirclize
  - highlightClones
  - StartracDiversity
  - quietVDJgenes
  - quietBCRgenes
  - quietTCRgenes
- title: Data
  desc: Reference data for package functions.
- contents:
  - contig_list
  - scRep_example

deploy:
  install_metadata: yes
