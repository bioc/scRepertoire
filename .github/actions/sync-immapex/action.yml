name: Sync immApex
description: >
  Install immApex from GitHub (BorchLab/immApex@devel) when the version resolved
  by Bioconductor lags behind GitHub. Keeps Bioconductor as the default source
  and only reaches to GitHub when the binary repos have not yet propagated a new
  immApex release.

inputs:
  ref:
    description: Git ref (branch/tag/SHA) of BorchLab/immApex to fall back to.
    required: false
    default: devel

runs:
  using: composite
  steps:
    - name: Sync immApex with GitHub if Bioconductor lags
      shell: Rscript {0}
      run: |
        ref <- "${{ inputs.ref }}"
        desc_url <- sprintf(
          "https://raw.githubusercontent.com/BorchLab/immApex/%s/DESCRIPTION", ref
        )
        gh_ver <- read.dcf(url(desc_url))[, "Version"]
        inst_ver <- tryCatch(
          as.character(packageVersion("immApex")),
          error = function(e) "0.0.0"
        )
        message(sprintf("immApex installed: %s | GitHub %s: %s", inst_ver, ref, gh_ver))
        if (package_version(inst_ver) < package_version(gh_ver)) {
          message(sprintf("Bioconductor lags GitHub -> installing BorchLab/immApex@%s", ref))
          pak::pak(sprintf("BorchLab/immApex@%s", ref))
        } else {
          message("Installed immApex is up to date; keeping Bioconductor build")
        }
