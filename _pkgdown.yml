reference:
- title: Loading and Processing Contigs
  desc: Functions that load, combine, and process the single-cell contig information.
- contents:
  - loadContigs
  - combineTCR
  - combineBCR
  - clonalBin
  - addVariable
  - subsetClones
  - exportClones
  - createHTOContigList
  - getContigDoublets
  - annotateInvariant
- title: Visualizing Clones
  desc: Functions for visualizing clonal data across samples and groups.
- contents:
  - clonalAbundance
  - clonalCompare
  - clonalDiversity
  - clonalHomeostasis
  - clonalLength
  - clonalOverlap
  - clonalProportion
  - clonalQuant
  - clonalRarefaction
  - clonalScatter
  - clonalSizeDistribution
  - vizGenes
- title: Summarizing Repertoire
  desc: Functions to summarize clonal sequences across the repertoire.
- contents:
  - percentGeneUsage
  - percentGenes
  - percentVJ
  - percentAA
  - percentKmer
  - positionalEntropy
  - positionalProperty
- title: Clustering and Similarity
  desc: Functions for clustering clones by sequence similarity.
- contents:
  - clonalCluster
- title: Single-Cell Object Visualizations
  desc: Functions to add or visualize clonal information along a single-cell object.
- contents:
  - combineExpression
  - alluvialClones
  - clonalBias
  - clonalNetwork
  - clonalOccupy
  - clonalOverlay
  - getCirclize
  - vizCirclize
  - highlightClones
  - StartracDiversity
- title: Utilities
  desc: Helper functions for filtering gene signatures and converting data.
- contents:
  - quietVDJgenes
  - quietBCRgenes
  - quietTCRgenes
  - expression2List
- title: Data
  desc: Reference data for package functions.
- contents:
  - contig_list
  - scRep_example

deploy:
  install_metadata: yes
